<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>surftcl: Tcl in the browser</title>

<style>
  html, body { height: 100%; margin: 0; background: #111; color: #ddd; }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.4;
  }
  .term {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 0.5rem;
    box-sizing: border-box;
  }
  .term-out {
    flex: 1;
    margin: 0;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .term-line { display: flex; align-items: flex-start; }
  .term-prompt { color: #8c8; white-space: pre; padding-top: 0; }
  .term-input {
    flex: 1;
    background: transparent;
    color: inherit;
    border: none;
    outline: none;
    font: inherit;
    padding: 0;
    resize: none;
    overflow: hidden;
    min-height: 1.4em;
  }

  /* ANSI SGR colors — standard 8, plus bold */
  .ansi-bold   { font-weight: bold; }
  .ansi-fg-0 { color: #555; } .ansi-bg-0 { background: #555; }
  .ansi-fg-1 { color: #e55; } .ansi-bg-1 { background: #e55; }
  .ansi-fg-2 { color: #8c8; } .ansi-bg-2 { background: #8c8; }
  .ansi-fg-3 { color: #cc6; } .ansi-bg-3 { background: #cc6; }
  .ansi-fg-4 { color: #88c; } .ansi-bg-4 { background: #88c; }
  .ansi-fg-5 { color: #c8c; } .ansi-bg-5 { background: #c8c; }
  .ansi-fg-6 { color: #6cc; } .ansi-bg-6 { background: #6cc; }
  .ansi-fg-7 { color: #eee; } .ansi-bg-7 { background: #eee; }

  .term-err { color: #e88; }
</style>
</head>
<body>

<div class="term" id="term"></div>

<script>
"use strict";

// A tiny channel between a DOM-based terminal surface and anything that wants
// to stream bytes at it. No transport assumed: the same object would work
// with a wasm interp, a WebSocket, or a mock in a test.
//
// Construction:
//   const term = SurfTclTerminal({ mount, prompt, onLine });
// Methods:
//   term.write(text)     — append text from "stdout"
//   term.writeErr(text)  — append text from "stderr" (styled distinctly)
//   term.clear()         — empty the output
//   term.setPrompt(text) — change the prompt
//   term.focus()         — focus the input
//
// ANSI: only SGR (\x1b[...m) is honored — colors, bold, reset. Any other
// escape sequences are stripped silently. This is a terminal *surface*,
// not a VT100 emulator.
function SurfTclTerminal({ mount, prompt = "% ", onLine = () => {} }) {
  const root = document.createElement("div");
  root.className = "term-inner";

  const output = document.createElement("pre");
  output.className = "term-out";

  const line = document.createElement("div");
  line.className = "term-line";

  const promptEl = document.createElement("span");
  promptEl.className = "term-prompt";
  promptEl.textContent = prompt;

  const input = document.createElement("textarea");
  input.className = "term-input";
  input.rows = 1;
  input.autocapitalize = "off";
  input.autocomplete = "off";
  input.spellcheck = false;
  input.setAttribute("aria-label", "surftcl input");

  // Autosize: textarea grows with content. Shrink first so scrollHeight
  // reflects the *needed* height, not the current.
  function autosize() {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  }
  input.addEventListener("input", autosize);

  line.append(promptEl, input);
  mount.append(output, line);

  // Persistent SGR state — sequences set style that lasts until reset.
  let style = { fg: null, bg: null, bold: false };

  function styleClasses() {
    const cs = [];
    if (style.bold) cs.push("ansi-bold");
    if (style.fg !== null) cs.push("ansi-fg-" + style.fg);
    if (style.bg !== null) cs.push("ansi-bg-" + style.bg);
    return cs;
  }

  function applySgr(codes) {
    for (const c of codes) {
      if (c === 0)              style = { fg: null, bg: null, bold: false };
      else if (c === 1)         style.bold = true;
      else if (c === 22)        style.bold = false;
      else if (c >= 30 && c <= 37) style.fg = c - 30;
      else if (c === 39)        style.fg = null;
      else if (c >= 40 && c <= 47) style.bg = c - 40;
      else if (c === 49)        style.bg = null;
      // unknown codes ignored
    }
  }

  // Walk a chunk of text, splitting on ESC sequences. Yields either
  // { text } for literal runs or { sgr: [codes] } for honored sequences.
  // CSI sequences other than SGR are consumed silently; lone ESC and
  // non-CSI escapes drop the next character.
  function* parse(text) {
    let i = 0;
    while (i < text.length) {
      const esc = text.indexOf("\x1b", i);
      if (esc < 0) { yield { text: text.slice(i) }; return; }
      if (esc > i) yield { text: text.slice(i, esc) };
      if (text[esc + 1] !== "[") { i = esc + 2; continue; }
      const rest = text.slice(esc + 2);
      const endRel = rest.search(/[A-Za-z]/);
      if (endRel < 0) return; // incomplete sequence at buffer end
      const final = rest[endRel];
      const params = rest.slice(0, endRel);
      if (final === "m") {
        const codes = params === "" ? [0]
          : params.split(";").map(n => parseInt(n, 10) || 0);
        yield { sgr: codes };
      }
      i = esc + 2 + endRel + 1;
    }
  }

  function append(text, extraClass) {
    for (const tok of parse(text)) {
      if (tok.sgr) { applySgr(tok.sgr); continue; }
      const classes = styleClasses();
      if (extraClass) classes.push(extraClass);
      if (classes.length === 0) {
        output.appendChild(document.createTextNode(tok.text));
      } else {
        const span = document.createElement("span");
        span.className = classes.join(" ");
        span.textContent = tok.text;
        output.appendChild(span);
      }
    }
    output.scrollTop = output.scrollHeight;
  }

  // History — arrow keys walk it; Enter pushes the submitted line.
  const history = [];
  let cursor = 0;

  // Enter submits. Shift+Enter inserts a newline (textarea default).
  // Arrows walk history only when the textarea is empty — otherwise they
  // navigate the cursor within multi-line content as you'd expect.
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      const value = input.value;
      input.value = "";
      autosize();
      append(promptEl.textContent + value + "\n");
      if (value !== "" && history[history.length - 1] !== value) history.push(value);
      cursor = history.length;
      onLine(value);
    } else if (e.key === "ArrowUp" && input.value === "") {
      if (cursor > 0) { cursor--; input.value = history[cursor]; autosize(); }
      e.preventDefault();
    } else if (e.key === "ArrowDown" && input.value === "") {
      if (cursor < history.length - 1) { cursor++; input.value = history[cursor]; autosize(); }
      else { cursor = history.length; input.value = ""; autosize(); }
      e.preventDefault();
    }
  });

  // Clicking anywhere in the terminal focuses the input — saves the user
  // from hunting for a cursor. We listen on mouseup, not mousedown: at
  // mousedown the user might be starting a drag-select, and the selection
  // is still empty (it grows on subsequent mousemoves). Focusing the input
  // from there clears the half-formed selection and the user can never
  // copy anything out. Mouseup fires after the drag completes, so a real
  // selection is already in place and our check honors it.
  mount.addEventListener("mouseup", (e) => {
    if (window.getSelection().toString() === "" && e.target !== input) {
      setTimeout(() => input.focus(), 0);
    }
  });

  return {
    write:     (text) => append(text),
    writeErr:  (text) => append(text, "term-err"),
    clear:     () => { while (output.firstChild) output.removeChild(output.firstChild); },
    setPrompt: (p) => { promptEl.textContent = p; },
    focus:     () => input.focus(),
  };
}

// Boot: wire the terminal to the Tcl interpreter once the wasm is ready.
import("./surftcl-bootstrap.mjs").then((surftcl) => { 
  surftcl.onReady(function (interp) {
    const term = SurfTclTerminal({
      mount: document.getElementById("term"),
      prompt: "% ",

      onLine: (line) => {
        if (line === "") return;
	try {
          let result = interp.Eval(line)
          if (result !== "") term.write(result + "\n");
        } catch (e) {
          term.writeErr((e.errorInfo || String(e)) + "\n");
        };
      },
    });

    // The interp's stdout/stderr now go through FS.init. Sinks receive the
    // byte stream Tcl emits, line-buffered to text, with newlines preserved.
    interp.stdout = (text) => term.write(text);
    interp.stderr = (text) => term.writeErr(text);

    // For testing convenience.
    window.__interp = interp;
    window.__surftcl = surftcl;

    // Grant a couple of JS functions to the inner Tcl interp. The host
    // decides what the inner interp can reach into; nothing JS-side is
    // visible by default. `eval` here is the obvious foot-gun and the
    // intended use of the registry — the bootstrap-then-seal pattern is
    // to grant it, run a Tcl-side init that wires up everything domain
    // specific, then `interp.js.revoke("eval")` before user input lands.
    //   ::surftcl::js::call alert {hello world}
    //   ::surftcl::js::call eval  {Math.PI}
    //   ::surftcl::js::names
    interp.js.register("alert", function (args) {
      window.alert(args.join(" "));
    });
    interp.GrantEval();

    // Make `update` the yield-to-the-substrate primitive: run Tcl's own
    // queue, then hand the JS event loop a turn (::surftcl::js::yield, backed
    // by Asyncify). Six lines of Tcl, no C idletask — so a long REPL
    // command that calls `update` keeps the page responsive instead of
    // freezing it. This is opt-in per page; the REPL installs it so yield
    // is there to play with.
    interp.Eval(`
      namespace eval ::surftcl::OLD {}
      rename update ::surftcl::OLD::update
      proc update {args} { ::surftcl::OLD::update {*}$args; ::surftcl::js::yield }
    `);

    // JS-side packages. Each is a small Tcl module that uses the granted
    // `eval` to install its JS shims at require-time, then exposes a Tcl
    // surface. Fetched here, dropped into the in-wasm filesystem, added
    // to auto_path. They're not pre-required — the user runs
    // `package require surftcl::json` (etc) themselves, demonstrating the
    // bootstrap-then-seal flow: require what you want, then revoke eval.
    const packageFiles = [
      "packages/wacl-json/pkgIndex.tcl",
      "packages/wacl-json/wacl-json.tcl",
      "packages/wacl-dom/pkgIndex.tcl",
      "packages/wacl-dom/wacl-dom.tcl",
      "packages/wacl-chan/pkgIndex.tcl",
      "packages/wacl-chan/wacl-chan.tcl",
    ];

    function installPackages() {
      // Package source lives at the repo root (../packages/…), one level
      // up from the demo; the in-wasm destination stays /packages/….
      return Promise.all(packageFiles.map((p) =>
        fetch("../" + p).then((r) => {
          if (!r.ok) throw new Error(p + ": " + r.status);
          return r.text();
        }).then((body) => {
          const fullPath = "/" + p;
          const dir = fullPath.substring(0, fullPath.lastIndexOf("/"));
          try { interp.Module.FS.mkdirTree(dir); } catch (e) {}
          interp.Module.FS.writeFile(fullPath, body);
        })
      )).then(() => {
        interp.Eval("lappend auto_path /packages");
      });
    }

    term.write("surftcl — Tcl " + interp.Eval("info patchlevel") + "\n");
    term.write("type tcl. enter submits, shift+enter for a newline.\n");
    term.write("JS bridge: ::surftcl::js::call NAME ARGLIST; granted: " +
               interp.Eval("::surftcl::js::names") + "\n");

    installPackages().then(() => {
      term.write("packages: surftcl::json, surftcl::dom, surftcl::chan " +
                 "(package require <name>; then ::surftcl::js::revoke eval)\n\n");
    }).catch((e) => {
      term.writeErr("package install failed: " + e + "\n\n");
    });

    term.focus();

    // Things to try from the JS console — `surftcl` is the canonical handle,
    // `__interp` / `__surftcl` are aliases for shorter typing:
    //   surftcl.Eval("expr {2+2}")
    //   surftcl.pushStdin("hello\n"); surftcl.Eval("gets stdin")
    //   surftcl.js.register("ping", a => "pong:" + a.join(","))
    //   surftcl.Eval("::surftcl::js::call ping one two three")
    //   surftcl.supportURL = "https://example.com/report"  // try an error
  })
});
</script>

</body>
</html>
