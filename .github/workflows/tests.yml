# GitHub Actions workflow for the wacl test suite.
#
# This file lives at `tests/github-workflow.yml.example` because the
# automation token used to push commits from inside dev sessions
# doesn't carry GitHub's `workflow` scope (which is required for any
# write under `.github/workflows/`). To install the workflow:
#
#     mv tests/github-workflow.yml.example .github/workflows/tests.yml
#     git add .github/workflows/tests.yml
#     git rm  tests/github-workflow.yml.example
#     git commit -m "ci: install the wacl test-suite workflow"
#     git push
#
# Once installed, the workflow runs on every push, every pull request,
# and on workflow_dispatch from the Actions tab.
#
# Deliberately minimal: node, checkout, run-headless.mjs. We don't
# rebuild the wasm — the artifacts in wacl-minimal-demo/ are what the
# headless runner reads. A wasm rebuild would require pinning
# emscripten 5.0.2 specifically and downloading ~200MB of tooling,
# which we don't need for "did the test suite break." If/when we want
# CI to verify the build itself, that's a separate workflow with its
# own trigger.
#
# Exit status: non-zero on any test failure or harness error. GitHub
# then surfaces a red X on the commit and on the PR's checks list.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:   # manual trigger from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run wacl tests
        run: node tests/run-headless.mjs
